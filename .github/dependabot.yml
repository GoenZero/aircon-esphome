version: 2
updates:
  # ESPHome itself (pinned in requirements.txt)
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: daily
    allow:
      - dependency-name: esphome
    commit-message:
      prefix: "esphome"

  # Actions used by the build workflow
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
