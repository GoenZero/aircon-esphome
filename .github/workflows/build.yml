name: Build

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        config: [aircon, aircon-setup]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -r requirements.txt

      - uses: actions/cache@v6
        with:
          path: |
            ~/.esphome
            ~/.platformio
          key: toolchain-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - run: esphome compile ${{ matrix.config }}.yaml

      - run: python tools/collect.py ${{ matrix.config }} aircon dist

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.config }}
          path: dist/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    # project.version is read from the first `version: "..."` line in aircon.yaml (under project:)
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      # The tag must be v<project.version> from aircon.yaml.
      - name: Check tag against project version
        run: |
          version=$(sed -n 's/^ *version: *"\(.*\)"/\1/p' aircon.yaml | head -1)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match project.version $version"
            exit 1
          fi

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # Re-running replaces the assets of an existing release instead of failing.
      - run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --verify-tag --generate-notes
          fi
        env:
          GH_TOKEN: ${{ github.token }}
